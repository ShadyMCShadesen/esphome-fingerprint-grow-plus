# Shared part of the multi-node examples (esp32-arduino, esp32-idf, esp8266).
# Include it with `packages:` and provide the substitutions listed below.
#
# Required substitutions: sensing_pin, enroll_button_pin

fingerprint_grow:
  id: grow
  uart_id: uart_sensor
  sensing_pin:
    number: ${sensing_pin}
    allow_other_uses: true
  on_finger_scan_matched:
    - if:
        # Admin fingers only operate the menu, and a finger shown during an admin action
        # (delete / re-enroll) is a target, not a visitor: never open anything for them.
        condition:
          not:
            or:
              - fingerprint_grow_plus.is_admin_slot: !lambda return finger_id;
              - fingerprint_grow_plus.is_admin_busy:
        then:
          - logger.log:
              format: "finger %u matched - your door/gate action goes here"
              args: [finger_id]

fingerprint_grow_plus:
  id: fp_plus
  finger_sensor: finger_detected        # touch pin: gestures end on lift, hold detection
  time_id: sntp_time                    # guest expiry
  enroll_slots: "1-179"
  delete_all_code: !secret fingerprint_delete_all_code
  fingerprint_count_sensor: fingerprint_count
  fingerprint_capacity_sensor: fingerprint_capacity
  on_enroll_started:
    - fingerprint_grow.aura_led_control:
        state: FLASHING
        speed: 50
        color: PURPLE
        count: 0

  # Admin fingers in slot 0 and 1 (protected). Touch, lift, wait 2 s:
  # 2x = enroll the next free slot, 3x + finger = delete that finger, 4x + finger = enroll it
  # again, 5x = enroll a guest. Keep it on the sensor for 3 s = status colour.
  admin:
    slots: [0, 1]
    on_touch:
      - fingerprint_grow.aura_led_control:
          state: FLASHING
          speed: 50
          color: CYAN
          count: 5
    on_hold:
      # health(): 0 green = all fine, 1 blue = sync running, 2 yellow = conflict, 3 red = error
      - lambda: |-
          static const uint8_t colors[] = {4, 2, 5, 1};
          id(grow).aura_led_control(2, 50, colors[id(fp_plus).health()], 5);
    on_waiting:
      - logger.log:
          format: "show the finger to %s"
          args: [action.c_str()]

  # Guest fingers in slots 150-179, valid 7 days, deleted (on all nodes) when they expire.
  guests: "150-179"

  # Sync with the other nodes. Leave this block out for a stand-alone node.
  sync:
    key: !secret fingerprint_grow_plus_key
    peers:                              # all nodes; a node skips itself
      - reader-garden.local
      - reader-garage.local
      - 192.168.10.23
      - reader-office.example.lan:18530
    allowed_networks:                   # accept peers only from here (optional)
      - 192.168.10.0/24
    exclude_slots: ["180-199"]          # stay on each node (node-exclusive)
    dry_run: false                      # true for the very first run on existing sensors
    on_failed:
      - logger.log:
          format: "fingerprint sync failed: %s"
          args: [reason.c_str()]
    on_conflict:
      - logger.log:
          level: WARN
          format: "slot %u holds different fingers on different nodes"
          args: [slot]

binary_sensor:
  - platform: gpio
    id: finger_detected
    name: Finger detected
    pin:
      number: ${sensing_pin}
      inverted: true
      allow_other_uses: true
  # Enroll with a physical button.
  - platform: gpio
    id: enroll_button
    name: Enroll button
    pin:
      number: ${enroll_button_pin}
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 50ms
    on_press:
      - fingerprint_grow_plus.enroll_next_free: 3
  - platform: fingerprint_grow_plus
    syncing:
      name: Fingerprint sync running

sensor:
  - platform: fingerprint_grow
    fingerprint_count:
      id: fingerprint_count
      name: Fingerprint count
    capacity:
      id: fingerprint_capacity
      name: Fingerprint capacity
  - platform: fingerprint_grow_plus
    peers_reachable:
      name: Fingerprint sync peers reachable
    error_count:
      name: Fingerprint sync errors
    conflict_count:
      name: Fingerprint sync conflicts

text_sensor:
  - platform: fingerprint_grow_plus
    occupied_slots:
      name: Occupied fingerprint slots
    status:
      name: Fingerprint sync status

# Enroll and delete from the web UI (web_server).
number:
  - platform: template
    id: selected_slot
    name: Selected slot
    optimistic: true
    min_value: 1
    max_value: 179
    step: 1
    initial_value: 1

button:
  - platform: template
    name: Enroll next free slot
    on_press:
      - fingerprint_grow_plus.enroll_next_free: 3
  - platform: template
    name: Enroll selected slot
    on_press:
      - fingerprint_grow.enroll:
          finger_id: !lambda "return (uint16_t) id(selected_slot).state;"
          num_scans: 3
  - platform: template
    name: Delete selected slot
    on_press:
      - fingerprint_grow_plus.delete: !lambda "return (uint16_t) id(selected_slot).state;"
  - platform: template
    name: Sync fingerprints now
    on_press:
      - fingerprint_grow_plus.sync
  - platform: template
    name: Allow restore for 5 minutes
    entity_category: config
    on_press:
      - fingerprint_grow_plus.allow_restore: 5min

time:
  - platform: sntp
    id: sntp_time
