# Shared part of the examples: fingerprint_sync plus the three enrollment methods
# that work without Home Assistant (physical button, web UI, admin finger).
# Include it with `packages:` and provide the substitutions listed below.
#
# Required substitutions: sensing_pin, enroll_button_pin

fingerprint_grow:
  id: grow
  uart_id: uart_sensor
  sensing_pin:
    number: ${sensing_pin}
    allow_other_uses: true
  on_finger_scan_matched:
    - if:
        # Admin fingers only operate the sync, and a finger shown during an admin action
        # (delete / re-enroll) is a target, not a visitor: never open anything for them.
        condition:
          not:
            or:
              - fingerprint_sync.is_admin_slot: !lambda return finger_id;
              - fingerprint_sync.is_admin_busy:
        then:
          - logger.log:
              format: "finger %u matched - your door/gate action goes here"
              args: [finger_id]

fingerprint_sync:
  id: fp_sync
  fingerprint_grow_id: grow
  uart_id: uart_sensor
  key: !secret fingerprint_sync_key
  # All nodes in one list; the node skips itself automatically.
  peers:
    - reader-garden.local
    - reader-garage.local
    - 192.168.10.23
    - reader-office.example.lan:18530
  # Only accept peers from these networks (optional).
  allowed_networks:
    - 192.168.10.0/24
  # Slots 180-199 stay local on every node (node-exclusive range).
  exclude_slots: ["180-199"]
  enroll_slots: "1-179"
  delete_all_code: !secret fingerprint_delete_all_code
  finger_sensor: finger_detected
  fingerprint_count_sensor: fingerprint_count
  fingerprint_capacity_sensor: fingerprint_capacity
  # Admin fingers (protected): 2 touches = enroll next free slot, 3 touches + finger = delete
  # that finger everywhere, 4 touches + finger = re-enroll it, 5 touches = enroll a guest,
  # hold 3 s = status (on_admin_hold). These are the defaults; `admin:` alone means slot 0.
  admin:
    slots: [0, 1]
  # Guest fingers (valid 7 days by default) are deleted on all nodes when they expire
  # (needs time_id).
  guests: "150-179"
  time_id: sntp_time
  on_admin_hold:
    # Status colour: green = in sync, blue = syncing, yellow = conflict, red = error.
    - lambda: |-
        static const uint8_t colors[] = {4, 2, 5, 1};
        id(grow).aura_led_control(2, 50, colors[id(fp_sync).health()], 5);
  on_admin_waiting:
    - logger.log:
        format: "show the finger to %s"
        args: [action.c_str()]
  # Recommended for the very first run on existing sensors: only log what would happen.
  dry_run: false
  on_sync_started:
    - logger.log: "fingerprint sync started"
  on_sync_done:
    - logger.log: "fingerprint sync done"
  on_sync_failed:
    - logger.log:
        format: "fingerprint sync failed: %s"
        args: [reason.c_str()]
  on_conflict:
    - logger.log:
        level: WARN
        format: "slot %u holds different fingers on different nodes"
        args: [slot]
  on_admin_touch:
    # First touch of the admin finger: show that the node waits for the second touch.
    - fingerprint_grow.aura_led_control:
        state: FLASHING
        speed: 50
        color: CYAN
        count: 5
  on_enroll_started:
    - fingerprint_grow.aura_led_control:
        state: FLASHING
        speed: 50
        color: PURPLE
        count: 0

binary_sensor:
  - platform: gpio
    id: finger_detected
    name: Finger detected
    pin:
      number: ${sensing_pin}
      inverted: true
      allow_other_uses: true
  # Method 1: physical button enrolls the next free slot.
  - platform: gpio
    id: enroll_button
    name: Enroll button
    pin:
      number: ${enroll_button_pin}
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 50ms
    on_press:
      - fingerprint_sync.enroll_next_free:
          num_scans: 3
  - platform: fingerprint_sync
    syncing:
      name: Fingerprint sync running

sensor:
  - platform: fingerprint_grow
    fingerprint_count:
      id: fingerprint_count
      name: Fingerprint count
    capacity:
      id: fingerprint_capacity
      name: Fingerprint capacity
  - platform: fingerprint_sync
    peers_reachable:
      name: Fingerprint sync peers reachable
    error_count:
      name: Fingerprint sync errors
    conflict_count:
      name: Fingerprint sync conflicts

text_sensor:
  - platform: fingerprint_sync
    status:
      name: Fingerprint sync status

# Method 2: web UI (web_server) - pick a slot or use the next free one.
number:
  - platform: template
    id: enroll_slot
    name: Enroll slot
    optimistic: true
    min_value: 1
    max_value: 179
    step: 1
    initial_value: 1

button:
  - platform: template
    name: Enroll next free slot
    on_press:
      - fingerprint_sync.enroll_next_free: 3
  - platform: template
    name: Enroll selected slot
    on_press:
      - fingerprint_grow.enroll:
          finger_id: !lambda "return (uint16_t) id(enroll_slot).state;"
          num_scans: 3
  - platform: template
    name: Delete selected slot on all nodes
    on_press:
      - fingerprint_sync.delete: !lambda "return (uint16_t) id(enroll_slot).state;"
  - platform: template
    name: Sync fingerprints now
    on_press:
      - fingerprint_sync.sync
  - platform: template
    name: Allow restore for 5 minutes
    entity_category: config
    on_press:
      - fingerprint_sync.allow_restore: 5min

time:
  - platform: sntp
    id: sntp_time
