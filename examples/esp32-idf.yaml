# Example: ESP32 dev board, ESP-IDF framework, R503 on UART2.
substitutions:
  sensing_pin: GPIO4
  enroll_button_pin: GPIO18

esphome:
  name: reader-garage

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
web_server:
  port: 80
ota:
  platform: esphome

external_components:
  # For your own nodes use a pinned release instead:
  #   - source: github://ShadyMCShadesen/esphome-fingerprint-grow-plus@v0.2.0
  - source:
      type: local
      path: ../components
    components: [fingerprint_grow_plus]

uart:
  id: uart_sensor
  rx_pin: GPIO16
  tx_pin: GPIO17
  baud_rate: 57600

packages:
  fingerprint_grow_plus: !include common-fingerprint-grow-plus.yaml
